# The report build, and THE ONLY WORKFLOW IN THIS REPOSITORY. The template shipped
# a second one, ci.yml -- a two-interpreter matrix running ruff, mypy and pytest
# -- and it was deleted at instantiation (fc-001 in docs/state.yaml): this
# repository has no library, no test suite and no pyproject.toml, so that job
# could not even reach its first step, and a workflow that is red for reasons
# unrelated to the report is one people learn to override.
#
# TWO JOBS NOW: `ledgers` parses the record, `build` compiles the document.
# od-004 closed -- the gap that used to be recorded here, that nothing checked
# whether docs/state.yaml and docs/inherited-measurements.yaml still parse, is
# closed by the first job below.
#
# Triggers do not fire on literally every push, so a branch with an open pull
# request is not built twice for the same commit. Every change in this repository
# reaches main through a PR, so this covers every change.
#
# WHY THE REPORT IS COMPILED IN CI AT ALL. The report is where a measurement
# becomes a claim, and a document that only ever builds on the author's machine
# is a document whose provenance nobody else can check. Compiling it on a clean
# runner is what makes "this PDF was produced from this commit" a testable
# sentence rather than an assurance.
name: Report

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The record, checked first because it is cheap and because a ledger that no
  # longer parses is a worse failure than a document that no longer builds.
  #
  # A SEPARATE JOB, NOT A STEP IN `build`: it must not wait behind a 44-second
  # TeX install to report a one-character YAML error, and it must still run when
  # the document build fails.
  #
  # NO DEPENDENCY, WHICH IS WHY IT IS THIS AND NOT PYTHON. YAML is not in
  # Python's standard library and PyYAML is not guaranteed on the runner, so the
  # obvious version of this check would have to `pip install` something -- and
  # CLAUDE.md's working agreement says never add a dependency without asking.
  # Ruby ships Psych in its standard library and is preinstalled on
  # ubuntu-latest, so this costs one `ruby -ryaml` and no install step at all.
  # `YAML.parse`, NOT `YAML.load`, AND THE REASON IS A FAILURE THIS CHECK ALREADY
  # HAD. The first version used YAML.load. It passed locally on Ruby 2.6 (Psych 3,
  # where load is unsafe-by-default) and FAILED on ubuntu-latest with
  # "Tried to load unspecified class: Date" -- Psych 4 made YAML.load
  # safe-by-default, and the ledgers carry unquoted dates like `2026-09-08`,
  # which YAML resolves to a Date. The fix is not to permit the class; it is to
  # stop instantiating classes at all. YAML.parse returns the node tree and
  # constructs nothing, which is exactly what "is this file parseable" asks, and
  # it behaves the same on every Psych version.
  #
  # THE LESSON IS THE ONE THIS REPOSITORY IS ABOUT, so it is recorded rather than
  # quietly fixed: the check WAS watched failing before it was committed -- a
  # broken ledger made it exit 1 -- but only on the axis its author thought of.
  # It was never run anywhere but the author's machine, so the environment
  # difference was invisible until CI. A check tested on one axis is a check
  # tested on one axis.
  ledgers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ledgers parse
        run: |
          ruby -ryaml -e '
            ok = true
            ["docs/state.yaml", "docs/inherited-measurements.yaml"].each do |f|
              begin
                doc = YAML.parse(File.read(f))
                raise "empty document" if doc.nil?
                raise "root is #{doc.root.class}, expected a mapping" unless doc.root.is_a?(Psych::Nodes::Mapping)
                puts "ok   #{f} (#{doc.root.children.length / 2} top-level keys)"
              rescue => e
                warn "FAIL #{f}: #{e.message.split("\n").first}"
                ok = false
              end
            end
            exit(ok ? 0 : 1)'

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # DERIVE THIS PACKAGE SET FROM main.log, DO NOT GUESS IT. The list below
      # covers what report/main.tex loads as shipped: article, geometry,
      # graphicx, booktabs, hyperref, lmodern, biblatex. When you add a package
      # to the document, read the new requirement out of the log and add it here.
      # Nothing here needs texlive-latex-extra, which is the large one, and
      # nothing needs texlive-full.
      #
      # MEASURED in the instance this template came from, on the first run of
      # this workflow: 43.7 s, 142 MB, 119 packages. That is not slow, so the
      # path filter on `report/**` that was held in reserve was never applied.
      # Re-measure before you assume it still holds for your package set.
      #
      # `lmodern` is listed explicitly and is NOT redundant with
      # texlive-fonts-recommended: that package ships the Latin Modern font
      # files, but lmodern.sty lives in Debian's `lmodern` package, and
      # --no-install-recommends stops it arriving as a recommend. The first run
      # of this workflow failed on exactly that -- `! LaTeX Error: File
      # 'lmodern.sty' not found` -- which a full local TeX installation could not
      # have caught, because it has everything.
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            lmodern \
            biber \
            latexmk

      # No language runtime step, and that is the point -- doubly so here, where
      # there is no language runtime to install. Generated figures would be
      # committed rather than built on the runner; there are none today. See
      # report/figures/README.md.
      - name: Build
        run: make -C report

      - name: Upload PDF
        # `always()` so a failed build still hands back the log to read.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-pdf
          path: |
            report/main.pdf
            report/main.log
          if-no-files-found: error
