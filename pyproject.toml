[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# RENAME. This name, the directory src/research/, and PACKAGE in
# tests/test_scaffold.py move together.
name = "research"
version = "0.0.0"
description = "A research project."
readme = "README.md"
requires-python = ">=3.12"
# No `license` field: this repository has no LICENSE file, and adding one is the
# maintainer's call, not the scaffold's.
#
# NO DEPENDENCIES AS SHIPPED, deliberately. Add them here rather than in CI, so
# that a local environment and the runner install the same set and neither can
# drift ahead of the other. CLAUDE.md's working agreement says never add one
# without asking; this is the file where the asking becomes visible in a diff.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "infrastructure: pins the scaffold, not any result about the subject matter",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true

# spikes/ is deliberately exempt from typing, linting and tests. It is where you
# try things; its only permitted output is a decision or a deletion. The import
# ban that keeps it out of the library is enforced in tests/test_scaffold.py,
# which is what makes the exemption safe rather than a hole.
[[tool.mypy.overrides]]
module = "spikes.*"
ignore_errors = true
