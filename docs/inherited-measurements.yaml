# ==============================================================================
# MEASUREMENTS — inherited priors, this project's own numbers, carried methods,
# and gaps.
#
# Read `status` on every entry. There are three kinds of value:
#
#   inherited  Measured elsewhere, under conditions this project has not
#              adopted. A PRIOR, not a fact about this project. Using one
#              without re-measuring is an assumption; say so when you do.
#   measured   Produced by a run IN THIS REPOSITORY. These are facts about this
#              project, and they are the only entries that are.
#   gap        A measurement that was NOT made, and whose absence is
#              load-bearing. It has no value. It is here so the absence is as
#              citable as a number, and so nobody rediscovers it by assuming it
#              away.
#
# WHY THIS FILE EXISTS AND A DOCUMENT DOES NOT. Prose cannot be contradicted and
# therefore cannot carry. A datum with provenance can be contradicted by a future
# measurement, so it can.
#
# WHEN YOU RE-MEASURE ONE OF THESE, DO NOT EDIT ITS VALUE. Add the new
# measurement as its own entry and set the old one's `status` to `superseded`,
# with `superseded_by`. The disagreement is the information.
#
# WHY THIS FILE IS THE SPINE OF A DOCUMENT-ONLY REPOSITORY, AND NOT A CATEGORY
# ERROR. This repository runs nothing. It holds one report ABOUT another project,
# which means EVERY figure in report/draft.md is `inherited` by the definition
# above — measured elsewhere, under conditions this repository has not adopted,
# a prior rather than a fact about this project. The template's own framing has
# `inherited` as the awkward minority status carried alongside a project's real
# measurements. Here it is the default and `measured` is the exception, and the
# file is closer to its own ideal than it would be in a project with experiments:
# a count in a repository at a pinned SHA is EXACTLY recheckable, in a way a
# physical measurement under recreated conditions never is.
#
# The one thing this repository will ever measure is the tally of its own
# claims-verification pass (report/claims-verified.md). That number, and nothing
# else, may ever carry `status: measured`.
#
# WHAT IS AWKWARD ABOUT THE SCHEMA HERE, said plainly rather than worked around:
# `units`, `n`, `conditions` and `provenance.environment` are shaped for a
# physical measurement. For "thirteen experiments" the units are "experiments",
# `n` is meaningless, and `environment` is null and always will be. They are
# filled honestly below rather than deleted, because the fields that DO carry
# weight here — `statement`, `value`, `provenance.source`, `status`, `notes` —
# are the same fields, and forking the schema to tidy four of them would cost
# more than the noise does.
# ==============================================================================

schema_version: 1

record:
  statuses:
    inherited: >-
      Measured elsewhere, under conditions this repository has not adopted. A
      prior awaiting re-test. Not established, not a baseline, not a target.
    measured: >-
      Produced by a run in this repository, with the commit that produced it.
      These are the numbers this project owns rather than inherits.
    gap: >-
      Not measured. Recorded because the absence is load-bearing.
    superseded: >-
      Replaced by a later measurement, which is named in `superseded_by`. The
      entry stays. Deleting it would delete the disagreement.
  compiled_at: null
  compiled_by: null

# Every `source:` path on an inherited entry resolves against one of these
# checkouts, at the SHA named here. Pin the SHA, never a branch: a citation to
# `main` is a citation to whatever `main` says the day it is read.
#
# Note the distinction from `measured_at_sha` on an entry, which is the commit
# the RUN was made at, as recorded by the source itself.
sources:

  - key: instance
    repo: visgraf/bio-3d-vision
    sha: 5f8e39f84a235bf53ace5789e739f0d51377344a
    role: >-
      THE SUBJECT. Nearly every figure in report/draft.md is a claim about this
      repository — thirteen experiments, their pre-registrations, runners, raw
      results, verdicts and findings, two ledgers, a technical report and its
      claims-verification pass. The draft calls it "the instance". Resolving a
      figure means opening a file in a checkout of this repository at this SHA.
    checkout_status: >-
      CLONED 2026-09-08 into .reference/bio-3d-vision at
      5f8e39f84a235bf53ace5789e739f0d51377344a (verified by rev-parse, not by
      the clone succeeding). gap-001 is closed. Thirteen experiments confirmed
      BY ENUMERATION of experiments/: exp001-exp005 and exp007-exp014, no
      exp006.

  - key: template
    repo: visgraf/math-ai-method
    sha: 81a638ee3f650050164e09a42f5a0561af6caeef
    sha_short: 81a638e
    role: >-
      What this repository was instantiated FROM, and a subject of §7 of the
      draft. Claims about what the template ships, and what it fixed relative to
      the instance, are claims about this source and NOT about `instance`. See
      the four-repository table in CLAUDE.md's domain invariants; conflating the
      two is the specific error the template's own front page was caught making.
    note: >-
      `sha` IS NULL ON PURPOSE AND THIS ENTRY IS THEREFORE NOT YET COMPLIANT
      with the rule above it, which requires a full 40-character SHA. The
      instantiation was recorded to this session as the abbreviated `81a638e`
      and nothing here can expand it without the repository. Recorded as an
      abbreviation in its own field rather than written into `sha`, because a
      7-character prefix in a field that promises 40 is the shape of a citation
      that looks resolvable and is not. Expand it at the first clone.
      EXPANDED 2026-09-08 on the first clone, as instructed. `sha_short` is kept
      beside it so the abbreviation that circulated in the specification and in
      README.md still resolves to something.

  - key: active-stereo
    repo: visgraf/active-stereo
    sha: null
    role: >-
      Predecessor. A full implementation with verified geometry and a decision
      record, whose loop never ran. The draft cites it for two things: the
      failure that motivated the low-ceremony lane, and the constitution clause
      that was false and talked a reviewer out of verifying.
    checkout_status: CLONED 2026-09-08 (default branch; no SHA pinned). See gap-001.

  - key: bioeye
    repo: visgraf/bioeye
    sha: null
    role: >-
      Predecessor. A thin vertical slice that closed the accumulation loop and
      not the perception-action loop. Listed with NO measurements attributed to
      it, which is a fact and not an oversight: "we read it and it had nothing"
      and "we never read it" are different, and this is the second.
    checkout_status: CLONED 2026-09-08 (default branch; no SHA pinned). See gap-001.

schema:
  id: Stable. Never reused, never renumbered. Cite this.
  statement: One line. What was measured.
  value: Scalar, or a mapping when the measurement is inherently per-condition.
  units: >-
    Explicit, always. Never "units: implied by the source". A number whose units
    are inferred at the point of use is the archetype of the failure this whole
    repository is arranged against.
  n: What the value is aggregated over. Never omitted; `null` where the source does not say.
  conditions: >-
    The stimulus, the instrument, the configuration — whatever makes the number
    reproducible and whatever bounds what it is a measurement OF. This field and
    `notes` are what stop a number that is true under one condition from being
    quoted as a property of the system.
  provenance: {cited_as, source, experiment, run_id, measured_at_sha, environment}
  provenance.environment: >-
    The interpreter and library versions the run executed under. `null` where the
    source records nothing, which is the honest state for most `inherited`
    entries.
    A FIELD RATHER THAN A COMMENT. In the instance this template came from it
    was prose in three places, which meant the one thing several numbers actually
    claimed — that they do not depend on their environment — was not queryable.
    `measured_at_sha` says which code produced a number; `environment` says which
    interpreter did, and for a reproduction claim the second is the load-bearing
    half.
    BACKFILL IS NOT INFERENCE. Fill it only where a source already records it.
    An interpreter that can be guessed from a build artifact is a guess, and a
    guess written into this field is exactly what the field exists to prevent.
  status: inherited | measured | gap | superseded
  superseded_by: The id that replaced it. Required when status is `superseded`.
  notes: Optional. Caveats that travel with the value, from the source.

# ------------------------------------------------------------------------------
# THE VALUES
#
# Ids are stable and never renumbered. Use one prefix per project so that a
# citation is self-locating in a report — the instance used `bio-` for its own
# and `as-` for one predecessor's. The `met-` and `gap-` spaces in this file are
# allocated the same way. See "HOW IDS ARE ALLOCATED" at the top of
# docs/state.yaml, which governs every id space in the record, and names the
# assumption that makes sequential allocation safe.
# ------------------------------------------------------------------------------
# THE PREFIX FOR THIS PROJECT IS `mn-` (method-notes).
#
# WHAT IS AND IS NOT HERE. This ledger is SEEDED, not complete. It holds the
# figures this repository has actually had occasion to handle — which, so far,
# means the pair below, found while adapting the template and recorded because
# finding them is what settled the question of whether this file belongs here at
# all. THE CENSUS OF EVERY FIGURE IN report/draft.md HAS NOT BEEN DONE. It is the
# claims-verification pass's job, it is od-001, and its absence is gap-002.
# Do not read a short `values` list as "the draft has few figures".
values:

  - id: mn-001
    statement: >-
      Claims checked in the claims-verification pass over the instance's
      technical report, as stated by the TEMPLATE.
    value: {checked: 22, confirmed: 10, corrected: 3, under_qualified: 8, unsupported: 0}
    units: claims
    n: null
    conditions: >-
      One verification pass, over the first draft of the technical report in
      `instance`. The five verdicts are those in report/claims-verified.md.
    provenance:
      cited_as: >-
        "22 claims were checked: 10 confirmed, 3 corrected, 8 under-qualified,
        0 unsupported"
      source: report/claims-verified.md, in this repository, carried verbatim from `template`
      experiment: null
      run_id: null
      measured_at_sha: null
      environment: null
    status: inherited
    status_note: >-
      RESOLVED AT SOURCE 2026-09-08 (od-002). Both former caveats are answered
      and are kept below rather than deleted, because the disagreement is what
      the entry was for.
    notes: >-
      TWO THINGS TO CARRY WITH THIS VALUE, BOTH NOW SETTLED. First, the four
      stated verdicts sum to 21 against a total of 22; the assumption that
      PARTIAL = 1 closes it WAS CORRECT and is now read at source — see mn-003.
      Second, it appeared to disagree with mn-002; it does not. mn-001 is the
      pass's full table, mn-002 its substantive subset, and claims 19-22 are the
      four bibliographic citations that separate them. Both entries are correct
      as written and NEITHER IS SUPERSEDED.
      WHAT THIS ENTRY ACTUALLY CAUGHT, since that is the reusable part: not an
      error in either number, but a MISSING SELECTOR in the prose that quoted
      them. The ledger could not have told you which was right — it told you
      that two things claiming to be the same number were not, which is the only
      job it has.

  - id: mn-002
    statement: >-
      Claims checked in the claims-verification pass over the instance's
      technical report, as stated by the DRAFT of this report.
    value: {load_bearing: 18, stood_as_written: 7, wrong_on_the_figure: 3, true_only_in_condition: 8}
    units: claims
    n: null
    conditions: >-
      Same pass as mn-001, restricted by the qualifier "load-bearing", which is
      met-002 and is nowhere defined.
    provenance:
      cited_as: >-
        "Of eighteen load-bearing claims in the first draft of the project's
        technical report, seven stood as written." (report/draft.md:870-871);
        also "corrected eleven of eighteen claims" (report/draft.md:1219)
      source: report/draft.md, in this repository
      experiment: null
      run_id: null
      measured_at_sha: null
      environment: null
    status: inherited
    notes: >-
      THIS PAIR IS THE ARGUMENT FOR KEEPING THIS FILE, so it is worth stating
      exactly. 18 = 7 + 3 + 8 and is internally consistent. Against mn-001 it
      shares the 3 and the 8 and differs on the total (18 vs 22) and the
      confirmed count (7 vs 10). THE RECONCILIATION THAT FITS: 22 claims were
      checked, of which 18 were load-bearing; 10 confirmed overall, 7 confirmed
      among the load-bearing. It fits every number. NEITHER PASSAGE SAYS IT.
      That is precisely an UNDER-QUALIFIED defect — a figure true of the subset
      it came from, carried into a sentence that does not name the subset —
      occurring in the two documents that ship the remedy, about the pass that
      invented the category. As prose in two files it could sit there
      indefinitely, because a paragraph cannot contradict a paragraph. As two
      entries with two values it is a disagreement a reader trips over.
      DO NOT "FIX" THIS BY EDITING EITHER SENTENCE. Resolve it at source (od-002)
      and add the resolution as a new entry.
      RESOLVED 2026-09-08. The reconciliation above is the one that held, and it
      was read at source rather than inferred: 22 minus the 4 bibliographic
      citation checks (claims 19-22) is 18, and striking the 3 confirmed
      citations from the CONFIRMED list of 10 leaves exactly 7. THE SOURCE'S OWN
      WORD IS "substantive", NOT "load-bearing" — see met-002. The defect was in
      report/draft.md's sentence, which was accurate about the FIRST of two
      passes and read as describing the verification of the report; amended at
      both cited locations in the same commit. This entry's value is unchanged
      and correct.

  - id: mn-003
    statement: >-
      The verdict class missing from the template's enumeration of the
      instance's first-pass tally.
    value: {partial: 1, claim: 19, total_reconciles_to: 22}
    units: claims
    n: null
    conditions: >-
      First pass only, verified in the source at d62693f. PARTIAL is defined in
      the same table as "verified except for a named part".
    provenance:
      cited_as: >-
        "**PARTIAL** | **1** | 19 (verified except its page range)" — the fifth
        row of the first-pass count table.
      source: >-
        instance: report/claims-verified.md, count table and section "## Citations"
        @5f8e39f84a235bf53ace5789e739f0d51377344a
      experiment: null
      run_id: null
      measured_at_sha: d62693f
      environment: null
    status: inherited
    notes: >-
      CLOSES THE 21-OF-22 ARITHMETIC GAP recorded against mn-001, and does so
      independently of the denominator question that od-002 settled. The
      template's prose says "22 claims were checked: 10 confirmed, 3 corrected,
      8 under-qualified, 0 unsupported" — four classes summing to 21 against a
      stated total of 22. The source's table has five classes and the fifth is
      PARTIAL = 1. 10+3+8+0+1 = 22.
      THE DROPPED CLASS IS NOT INCIDENTAL. Claim 19 is Bajcsy 1988, PARTIAL
      because its page range does not resolve — three variants appear across
      otherwise reliable sources and the source's recommendation is to cite by
      DOI and issue and "Do not pick one of the three". An enumeration that
      drops PARTIAL drops the one verdict recording that a citation could not be
      settled, which is precisely the class a reader most needs to see.

# - id: <prefix>-001
#   statement: <one line>
#   value: <scalar or mapping>
#   units: <explicit>
#   n: <what it aggregates over, or null>
#   conditions: <what makes it reproducible, and what bounds it>
#   provenance:
#     cited_as: <how the source names it>
#     source: <path within the pinned checkout, or this repository>
#     experiment: <exp id>
#     run_id: <if the source has one>
#     measured_at_sha: <the commit the run was made at>
#     environment: {python: null, numpy: null}
#   status: inherited | measured | gap | superseded
#   notes: >-
#     The caveat that must travel with the value. IF THE NUMBER IS MOST EXPOSED
#     TO SOME GAP, SAY SO HERE, IN THE WORDS YOU WOULD WANT QUOTED. This field is
#     what a report's verification pass reads back; a caveat that exists only in
#     a findings file does not travel.

# ==============================================================================
# CARRIED METHODS
#
# A method is a criterion, threshold, tolerance, window, bar, or convention that
# governs how results are scored. It is not a number about the world; it is a
# number about how you will decide what the world said.
#
# ENTER A METHOD HERE AT FIRST USE, NOT AT FIRST SUSPICION. This is the rule
# this section exists for and it is the single most expensive lesson in this
# template.
#
# WHY, IN ONE SENTENCE: in the instance this template came from, carried NUMBERS
# got a `status` field on day two and carried METHODS got one only at experiment
# twelve, by which time a statistical criterion nobody had examined had governed
# ten experiments and turned out not to test what it was read as testing.
#
# The long version is met-001 below. Read it. It is kept as the section's only
# entry because a rule with a worked example survives simplification and a rule
# without one does not.
#
# `kind` is the whole point of this section:
#   measurement — this repository measured it, and the measurement is cited.
#   choice      — this repository chose it deliberately and said why, here.
#   carried     — it walked in and has NEVER been examined here. The third
#                 category is the finding. Count them; the count is a fact about
#                 the project and belongs in the record as a gap.
#
# NOTHING IN THIS SECTION IS RE-DERIVED BY BEING LISTED. The audit is the
# deliverable. A value being `carried` is not an accusation that it is wrong — it
# is a statement that nobody here knows whether it is.
#
# THE TEST FOR WHETHER SOMETHING BELONGS HERE: if this value changed, would any
# verdict in this repository change? If yes, it is a method, and it needs an
# entry the first time it decides anything.
# ==============================================================================
methods:

  # --- WORKED EXAMPLE, from the instance. Not one of your methods. -------------
  #
  # It is left in place rather than described in a comment because the shape of
  # the entry is the lesson: what `kind` records, what `re_derived_here` costs
  # when the answer is NO, and what `to_re_derive` looks like when the thing to
  # derive is not a quantity at all.
  #
  # DELETE IT once your own `methods` section has an entry that teaches the same
  # thing. Until then it is doing more work than an empty list.
  - id: met-000-EXAMPLE
    what: >-
      An indistinguishability criterion, carried from a predecessor experiment:
      two arms count as distinguishable on a metric iff the mean paired
      difference across seeds exceeds BOTH the seed-to-seed spread sd(d_s) AND a
      2% materiality floor.
    kind: carried
    from: >-
      The predecessor's own first experiment. Its preregistration said so
      explicitly — "reused rather than invented" — which is exactly the phrase
      that should have triggered an entry here, and did not.
    re_derived_here: >-
      NO, AND THAT IS WHAT IT COST. Used unexamined in ten consecutive
      experiments — every comparison the project ever scored. The eleventh
      iteration was the first to notice that sd(d_s) is a SAMPLE STANDARD
      DEVIATION and not a standard error, so the bar is far stricter than a
      significance test and was being read as one. The twelfth measured what that
      cost: 45 of 96 null results read differently under the other bar.
    to_re_derive: >-
      Nothing to derive — it is a threshold, not a quantity. What it needed was a
      STATEMENT OF WHAT IT ASKS, which is "does the effect exceed scene-to-scene
      variation", i.e. would this reliably help on a NEW scene. That is a
      legitimate and deliberately strict question. THE DEFECT WAS NEVER THE BAR.
      It was that nobody had written down which question it answers, so ten
      experiments' worth of prose called its verdicts "statistically
      indistinguishable" when the criterion in force was not a significance test.
    what_the_entry_would_have_cost_on_day_one: >-
      Four lines and one honest word: `kind: carried`. That is the whole
      intervention. It does not require examining the method, re-deriving it, or
      even doubting it — only recording that it walked in unexamined, so that the
      first person to wonder finds the wondering already half done.
    status: examined_at_experiment_twelve

  # --- THIS REPOSITORY'S OWN CARRIED METHODS ----------------------------------

  - id: met-001
    what: >-
      The verdict taxonomy that scores every claim in this report:
      CONFIRMED / CORRECTED / UNDER-QUALIFIED / UNSUPPORTED / PARTIAL, with
      UNDER-QUALIFIED defined as "true in the band, arm, metric or stimulus it
      came from, and unsupported as written".
    kind: carried
    from: >-
      `template`, in report/claims-verified.md, which carried it from the
      instance's own verification pass. It arrived with this repository at
      instantiation and has never been examined here.
    re_derived_here: >-
      NO. Entered BEFORE first use rather than at it — the pass has not run yet.
      That is STRICTER than the rule this section states and is not required by
      it; it costs four lines and it is entered now because the whole lesson of
      met-000 is that the cheap moment to write `kind: carried` is before anyone
      has a reason to.
    to_re_derive: >-
      Nothing to derive; it is a taxonomy, not a quantity. What it needs is a
      statement of the boundary between UNDER-QUALIFIED and CORRECTED, because
      that boundary decides the headline number this repository will publish
      about itself. A claim whose figure is right and whose scope is missing can
      be scored either way by a reasonable reader, and mn-001's tally is a
      3-and-8 split across exactly that line.
    why_it_matters_here: >-
      It passes the test at the top of this section: if this taxonomy changed,
      the one number this repository will ever own — its own claims tally —
      would change. It is therefore a method, and it governs everything.
    status: carried_unexamined

  - id: met-002
    what: >-
      The selection criterion "load-bearing", which decides WHICH claims in a
      report get counted in the denominator of a verification tally.
    kind: carried
    from: >-
      report/draft.md, which uses it in the sentence that carries the report's
      central argument ("Of eighteen load-bearing claims ... seven stood as
      written"). No definition accompanies it anywhere in this repository.
    re_derived_here: >-
      NO, AND IT IS ALREADY COSTING SOMETHING. This undefined criterion is the
      most likely explanation of the mn-001 / mn-002 disagreement: 22 claims
      checked against 18 "load-bearing" ones. An undefined selector on a
      denominator is invisible, because a ratio quoted without it still reads as
      a complete sentence.
    to_re_derive: >-
      Write down the rule that separates a load-bearing claim from a checked one,
      BEFORE recounting anything. A criterion chosen after seeing which one
      reconciles the two figures is the same defect as an unexamined carried
      method with a different unit on it. Then apply it and record the count as a
      new entry, superseding neither mn-001 nor mn-002.
    what_the_entry_would_have_cost_on_day_one: >-
      One line: `load-bearing: <the rule>`. The draft's strongest single
      sentence — the asymmetry that §5 says justifies the whole method — rests on
      this word.
    examined_2026_09_08: >-
      EXAMINED AT SOURCE, AND THE WORD IS NOT THE SOURCE'S. The instance's pass
      says "substantive", and its operative meaning is exact and checkable:
      a claim about the project, as opposed to a bibliographic citation check.
      The pass's 22 claims split 18 substantive / 4 citations at a heading
      boundary ("## Citations"), so the selector is not a judgement call at all —
      it is a section.
      "LOAD-BEARING" IS THE DRAFT'S OWN COINAGE AND IT IS WEAKER THAN WHAT IT
      REPLACED. It reads as "important", which is a judgement, where the source's
      selector was structural. That substitution is the defect: not a wrong
      number, a criterion that got vaguer in transit and took a denominator with
      it. This is the same shape as met-000's carried statistical bar — a
      criterion nobody had written down being read as something stricter or
      looser than it was.
    status: examined_at_the_first_claims_pass

# ------------------------------------------------------------------------------
# GAPS
#
# Measurements that were NOT made and whose absence bounds what can be claimed.
# They have ids and are cited exactly like values, because "we did not measure
# this" is a thing a foreclosure needs to be able to point at.
#
# A gap is not a to-do list item. A to-do can be closed by deciding it does not
# matter; a gap is closed only by a measurement, or by a foreclosure that says
# in writing what is being given up.
# ------------------------------------------------------------------------------
gaps:

  - id: gap-001
    status: CLOSED 2026-09-08
    closed_by: >-
      All four sources cloned into .reference/ at the pinned SHAs (bio-3d-vision
      at 5f8e39f, math-ai-method at 81a638e, active-stereo and bioeye at their
      default branches, unpinned — see the note in `sources`). The
      claims-verification pass in report/claims-verified.md was run against them.
    statement: >-
      No source repository has been cloned or read. Every `sources` entry is
      marked NOT CLONED, and no figure in report/draft.md has been resolved to a
      file and a line in the record it claims to come from.
    why_it_is_load_bearing: >-
      It bounds every factual claim the report makes. The draft's own status
      block says its claims about the source project have not been through a
      verification pass, and Appendix A's closing sentence — "Every claim these
      notes make about what happened can be checked in the third" — is at present
      a statement about what is POSSIBLE, not about what has been done. mn-001
      and mn-002 cannot be reconciled while this gap is open. It is the single
      gap that stands between this repository and its deliverable.
    what_would_close_it: >-
      Clone `visgraf/bio-3d-vision` at 5f8e39f into .reference/, and
      `visgraf/math-ai-method` at the expanded SHA beside it, then run the pass
      in report/claims-verified.md. Nothing here needs an instrument; it needs
      two clones and a reading.

  - id: gap-002
    statement: >-
      No census of the figures in report/draft.md has been taken. The number of
      distinct factual claims in the document is unknown.
    why_it_is_load_bearing: >-
      It bounds the completeness of this ledger, and therefore how much a short
      `values` list means. Two entries here are not evidence that the draft
      contains two figures; they are evidence that two were handled. It also
      bounds the repeated-claim check in report/claims-verified.md, which cannot
      be run over a set nobody has enumerated — and that check is the one the
      template records as having fired.
    what_would_close_it: >-
      The mechanical grep in report/claims-verified.md, run over draft.md, with
      every hit triaged into a claim or discarded as a section number. NOTE THAT
      THE SHIPPED COMMAND DOES NOT WORK AS WRITTEN on this document: run against
      draft.md it returns section numbers ("4.1", "8.6") and its `uniq -f2`
      field-counting collapses the result to a single line. See od-003.

# - id: gap-001
#   statement: <what was not measured>
#   why_it_is_load_bearing: >-
#     Which claims are bounded by it, cited by id. A gap that bounds nothing is
#     an idea for future work and does not belong here.
#   what_would_close_it: <the run, and the instrument it needs>
