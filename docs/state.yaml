# ==============================================================================
# STATE — written by Code, read by Chat. Never the reverse.
#
# Chat does not edit this file. That is what keeps it a report of what is true
# rather than a record of what was intended. It is the only durable channel from
# Code back to Chat, and it is why a Chat session can start without a briefing.
#
# Update it in the same commit as the change it describes. If it disagrees with
# the repository, the repository is right and this file is a bug.
#
# DOES A DOCUMENT-ONLY PROJECT HAVE A DECISION LEDGER? YES, AND THE ARGUMENT FOR
# ONE NEVER DEPENDED ON THERE BEING EXPERIMENTS. The ledger exists so a later
# session can tell "we decided against this" from "nobody thought of it" — two
# states that look identical in a tree and are not the same thing. Editorial
# decisions have exactly that property, and arguably more strongly: a deleted
# directory leaves no trace at all, whereas an abandoned code path usually leaves
# an import. The template's own instantiation into this repository deleted six
# things, and without `foreclosures` below there would be nowhere to say why —
# a future reader would find a repository that simply never had tests.
#
# THE TEST THIS FILE PASSED: the adaptation task that produced this repository
# generated six foreclosures, five open decisions and a stopping rule ON ITS OWN,
# before any report work started. A file that fills up during its own
# instantiation is not ceremony.
#
# WHAT DOES NOT TRANSFER, marked rather than deleted: `falsifier_verdicts` and
# `constraints` are still empty and may stay that way. See their headers.
#
# The blocks below carry the template's schemas and rules. Entries are this
# repository's own.
# ==============================================================================

schema_version: 1
updated_at: 2026-09-08    # ISO date. Set it when you first write an entry.

# ------------------------------------------------------------------------------
# HOW IDS ARE ALLOCATED
#
# Seven id spaces are in use across this file and
# docs/inherited-measurements.yaml: fc- (foreclosures), od- (open decisions),
# fv- (falsifier verdicts), cn- (constraints), am- (amendments), met- (carried
# methods), gap- (recorded absences), plus one project prefix for measurements.
#
# THE RULE: sequential per kind, allocated by Code at the moment the entry is
# written, NEVER REUSED AND NEVER RENUMBERED. An id that has been cited anywhere
# — a findings file, a report, a commit message, another entry — is permanent
# even if the entry it names is later superseded, corrected or found to be wrong.
# Renumbering is what turns a citation into a lie.
#
# THE DIVISION THAT MAKES THAT POSSIBLE, since Chat also writes about ids:
# CHAT'S SPECIFICATIONS REFER TO THE KIND, NEVER TO A NUMBER. A specification
# says "record this as a foreclosure, at altitude fw" — it does not say "record
# this as fc-014". CODE ALLOCATES THE NUMBER AT WRITE TIME, because Code is the
# station holding the file and can see what the last one was.
#
# That is not etiquette. It is what keeps allocation serialised through a single
# writer: a number chosen by the station that cannot see the ledger is a number
# chosen against a stale view of it, and two specifications drafted the same
# afternoon would choose the same one. It is also THE ASSUMPTION THAT BREAKS
# FIRST if a second writing agent appears — before any of the merge machinery
# below is reached, two Codes writing at once collide on the next number.
#
# THE ASSUMPTION THAT MAKES IT WORK, NAMED SO YOU CAN CHECK IT AGAINST YOUR OWN
# SETUP: in the instance this template came from, ONE agent wrote the ledger and
# ONE human merged every change, so allocation was effectively serialised and two
# branches could not claim fc-014 at the same time. Nothing enforced that; the
# shape of the project did.
#
# THIS FILE IS APPEND-MOSTLY AND IT IS THE CHANNEL OF RECORD, so a collision here
# is a merge conflict in the one place the project cannot afford one. If you will
# have more than one writing agent, or long-lived parallel branches, DECIDE HOW
# IDS ARE ALLOCATED BEFORE YOU HAVE TWO BRANCHES OPEN — not after the first
# conflict. Workable answers include a reserved range per branch, allocation at
# merge time rather than write time, or ids that are not sequential at all
# (a short hash, a date-stamp). Each costs something; pick deliberately and
# record the choice as a foreclosure.
# ------------------------------------------------------------------------------

# PROVENANCE, NOT A STALENESS TEST. This names the repository state the file
# describes — the same role `measured_at_sha` plays on a measurement. It
# NECESSARILY LAGS the commit that carries it, because no commit can name the
# merge that contains it, and that lag is not staleness. Do not compare it
# against HEAD and conclude anything.
#
# In the instance this template came from, this field first carried the comment
# "so a reader can tell a stale state file from a current one", which invited
# exactly that comparison and would have fired after every merge. A check that
# always fires is one a cold session learns to skip. Staleness is tested per
# half in `sequence`, and each half gets the test it can actually pass.
updated_by_commit: null   # the repository state this file describes
# Null on the commit that introduces it, necessarily: no commit can name itself.
# Set it to the adaptation commit on the next change to this file.

# ------------------------------------------------------------------------------
# SEQUENCE — where this project is, and what it plans next
#
# TWO HALVES, AND THEY HAVE DIFFERENT STANDING. `position` is established: it is
# derivable from the foreclosure ledger and the merged history, and it cannot be
# wrong without the ledger being wrong. `plan` is INTENT, supplied from the Chat
# surface, and is not established by anything in this repository.
#
# The distinction is the same one docs/inherited-measurements.yaml draws between
# `measured` and `inherited`, and for the same reason: a future session should
# treat the plan half as a prior, not as a fact.
#
# WHY THE SPLIT EXISTS. This block was originally specified as "position, not
# intent", as one list. That was wrong: a plan amended twice in seven iterations
# and expected to be amended again is not position. Worse, the two decayed
# together — the instance's centrepiece step still read `planned` while the code
# it described was running, and a cold session deriving its position from the
# intent half would have taken the project's whole purpose as unstarted.
#
# Nothing normative lives here. Invariants are in CLAUDE.md, decisions in
# `foreclosures`, measurements in docs/inherited-measurements.yaml. This block
# exists so a session starting cold knows where it is.
# ------------------------------------------------------------------------------
sequence:

  # --- STOPPING RULE: required, and empty is a legal answer --------------------
  #
  # REQUIRED. Fill it with "none yet" rather than deleting it, so that its
  # absence is visible instead of merely being the case.
  #
  # WHY IT IS A REQUIRED FIELD AND NOT ADVICE. The instance this template came
  # from ran for five days with no stopping rule and no budget. It was flagged in
  # its first week and never fixed, and nothing in the repository made the
  # omission legible: an absent stopping rule looks exactly like a project that
  # has not needed one yet. A field that must be filled turns "we never decided"
  # into a sentence somebody has to type.
  #
  # A stopping rule is a statement about the PROJECT, not about a task. It names
  # a condition on which the work stops or changes shape, decided in advance of
  # the evidence that would trigger it — which is the same reason a falsifier is
  # declared before the run. Any of these is a legitimate form:
  #   - a budget: iterations, wall-clock, or compute, with what happens at the end
  #   - a result: "if the effect is indistinguishable at N seeds, the branch closes"
  #   - a gate: "the loop must run before any further instrument work"
  #   - "none yet", with the date it was last considered
  stopping_rule:
    rule: >-
      A gate, not a budget. THE REPORT IS NOT TYPESET UNTIL THE
      CLAIMS-VERIFICATION PASS HAS RUN AGAINST A CLONED CHECKOUT (gap-001), and
      it is not published until every claim in report/draft.md is either
      CONFIRMED or carries its correction in the sentence. If the pass cannot be
      run — if the source repositories are unavailable at the pinned SHAs — the
      work stops and the reason is recorded here, rather than the document
      shipping with its figures unresolved.
    decided_at: 2026-09-08
    last_considered: 2026-09-08
    note: >-
      TYPED AT INSTANTIATION RATHER THAN LEFT AT "none yet", which the template
      says is a legal answer and which the source instance left standing for five
      days after being told in week one. It was easy to type here for a reason
      worth recording: a document-only project has a natural terminal condition
      that a research project does not, because the deliverable is finite and its
      correctness criterion is already written down in report/claims-verified.md.
      Do not read the ease of filling this field as evidence that the template's
      complaint was overblown.

  staleness:
    note: >-
      NO SINGLE RULE, BECAUSE THE TWO HALVES GO STALE DIFFERENTLY. Each half
      carries the check it can actually pass; see `position.checking` and
      `plan.staleness`. A rule that fires on every merge is a rule a cold session
      learns to skip, which is the failure this arrangement replaced.

  # --- POSITION: established, derivable from the ledger and merged history -----
  position:
    standing: >-
      Established. Every entry below is derivable from `foreclosures`, the
      measurement record, and the merged history. It cannot be wrong without one
      of those being wrong.
    checking: >-
      DERIVE IT, DO NOT TRUST IT. This half has no timestamp and needs none: it
      claims to be derivable, so the check is to derive it. Three questions, each
      with a definite answer from the repository alone:
        (1) for every step in `complete`, does the entry named in `evidence`
            EXIST, and does that entry, READ IN FULL, ACTUALLY DECIDE WHAT THE
            STEP'S TITLE NAMES. Both halves are required and the second is the
            one that bites: an id that resolves is not an id that agrees. If the
            step is "Decide X", find the sentence in the named entry that decides
            X. If there is no such sentence, the claim is unearned and this check
            has failed, however well-formed the reference is;
        (2) is `next` the lowest-numbered step that is neither complete nor
            deferred;
        (3) does every id referenced anywhere in this block resolve — in
            `foreclosures`, `open_decisions`, `falsifier_verdicts`, or
            docs/inherited-measurements.yaml — counting an id this block names as
            CLOSED and redirects as resolving through its redirect, not as
            dangling.
      If all three hold, this half is current, whatever the date says. If one
      fails, the ledger and this block disagree and THE LEDGER IS RIGHT.
    why_clause_1_is_worded_that_way: >-
      IT WAS WEAKER ONCE AND PASSED ON A FALSE CLAIM. In the instance, clause (1)
      asked whether the entry named in `evidence` "still says what is claimed
      here", and that was applied against the citation's own words rather than
      against the step's title. A completed step read "Decide the plant" with a
      foreclosure id beside it; the id resolved, the sentence describing it was
      true, and the foreclosure decided the disparity search window instead —
      none of its eleven fields mentioned a plant. The check recorded three
      passes on a claim the ledger contradicted, and it was caught four
      iterations later by a cold session's arrival audit, which is not where it
      should have been caught. A check that passes on a false claim is the same
      shape as a claim that cannot fail.
    checking_run: >-
      RECORD EACH RUN HERE, INCLUDING THE ONES THAT FAIL, and keep the previous
      record beside the correction rather than overwriting it. The defect is
      worth more than the fix.
    complete: [1]
    deferred: []            # - {step: <n>, until: <condition>}
    next: 2
    evidence:
      1: >-
        fc-001 through fc-006 in this file, and the adaptation commit that
        carries them. Read against clause (1) above: step 1's title is "Adapt the
        template to a document-only shape", and each foreclosure names one thing
        deleted or kept AND WHY — not merely that it happened.
    out_of_sequence:
      - what: >-
          Two inherited measurements (mn-001, mn-002) and two carried methods
          (met-001, met-002) were entered in docs/inherited-measurements.yaml.
        note: >-
          Recorded here so no id in that file is orphaned. They were not the task
          and are not step 1's output: they came out of READING the draft closely
          enough to decide whether the measurement ledger belonged in this
          repository. The met- entries are required by CLAUDE.md's first-use
          rule; the mn- pair is the evidence that settled fc-006.
    # out_of_sequence holds work that was really done and is not one of the
    # numbered steps. Entries are {what, note}. IT IS NOT A REMAINDER BIN: its
    # job is that a cold session finding a verdict id or a measurement id in this
    # file always has a step to attach it to. Anything that produced an id and
    # is not attributable to a numbered step goes here, or the id is orphaned.

  # --- PLAN: intent, from Chat, NOT established here ---------------------------
  plan:
    source: chat
    standing: >-
      NOT ESTABLISHED IN THIS REPOSITORY. Supplied from the Chat surface, where
      it lives as a document in the maintainer's hands. Nothing here measures or
      pins it. Treat it as a prior, exactly as an `inherited` entry in
      docs/inherited-measurements.yaml is treated — usable, and an assumption
      whenever it is relied on.
    amended: 0              # how many times, and over how many iterations
    staleness:
      last_amended_commit: null
      rule: >-
        STALE IF AN AMENDMENT HAS BEEN TAKEN SINCE `last_amended_commit` AND IS
        NOT RECORDED BELOW. This half is the one that can rot silently — it is
        not derivable from anything here, so nothing in the repository
        contradicts it when it goes wrong.
        The marker is the last commit that CHANGED THE PLAN, not the last merge.
        Merges that do not touch the plan do not make it stale, which is why this
        will not fire spuriously — and why, unlike a rule keyed to the last
        merge, it can be passed.
      checking: >-
        Two steps, because this file changes for many reasons and only some of
        them are amendments.
          (1) `git log <last_amended_commit>..main -- docs/state.yaml` lists
              commits that touched the file at all. Most will not have touched
              the plan.
          (2) For any that did, compare `sequence.plan` between the two
              revisions. ONLY a change to a step, a stage, or `amendments` bumps
              `last_amended_commit`.
        One clause is not answerable from the repository at all: whether the
        maintainer has taken an amendment that was never recorded here. No marker
        can close that, and it is exactly what `source: chat` is warning about.
    stages:
      - stage: 1
        name: Instantiate
        steps:
          - n: 1
            title: Adapt the template from a research shape to a document-only one
            altitude: infra
            status: complete
            outcome: fc-001..fc-006, od-001..od-005, gap-001, gap-002
      - stage: 2
        name: Verify
        steps:
          - n: 2
            title: >-
              Clone the sources at their pinned SHAs and run the
              claims-verification pass over report/draft.md
            altitude: exp
            status: next
            outcome: null
          - n: 3
            title: Reconcile mn-001 against mn-002 and define "load-bearing" (met-002)
            altitude: exp
            status: planned
            outcome: null
      - stage: 3
        name: Typeset
        steps:
          - n: 4
            title: >-
              Typeset the verified draft into report/main.tex, in the same pull
              request as the draft revision it came from
            altitude: impl
            status: planned
            outcome: null
          - n: 5
            title: Section 8.6, to be written by the first author
            altitude: impl
            status: planned
            outcome: null
    # THE STANDING OF THIS BLOCK IS UNCHANGED AND WORTH RE-READING: `source: chat`
    # means nothing here established this plan. Steps 2-5 are read off the draft's
    # own status block and Appendix A, which is INFERENCE FROM THE DOCUMENT, not
    # an amendment taken from the maintainer. If the maintainer's plan differs,
    # this half is wrong and the repository will not contradict it.
    # - stage: <n>
    #   name: <short name>
    #   steps:
    #     - n: <step number>
    #       title: <what it does>
    #       altitude: fw | exp | impl | infra    # see open_decisions below
    #       status: planned | next | complete | deferred
    #       outcome: <the id or artifact it produced, once complete>
    amendments: []
    # An amendment is recorded, never applied silently. Fields that earn their
    # place: {id, moved, from, to, origin, reason}. `origin` matters — an
    # amendment from the Chat surface and one forced by a measurement have
    # different standing, and only the second is derivable from this repository.
    # WHERE A CLAIM IN THIS FILE TURNS OUT TO BE FALSE, CORRECT IT IN PLACE AND
    # KEEP THE FALSE VERSION BESIDE THE CORRECTION. The history is forward-only.

# ------------------------------------------------------------------------------
# WHAT RUNS
#
# The entry points a session can actually invoke, with their cost. This block is
# what stops "what does this repository do" from being answered by reading src/.
# ------------------------------------------------------------------------------
runs:
  summary: >-
    ONE, and it builds a document. There is no library, no test suite and no
    experiment runner in this repository; `pyproject.toml` and the Python CI gate
    were deleted at instantiation (fc-001, fc-002). A session asking "what does
    this repository do" is answered by this block in full.
  entry_points:
    - call: make -C report
      does: >-
        Compiles report/main.tex to report/main.pdf with latexmk and biber.
        Builds from a clean checkout with a TeX installation alone.
      cost: >-
        NOT MEASURED HERE. The TeX install step in .github/workflows/report.yml
        carries an inherited figure from the template — 43.7 s, 142 MB, 119
        packages on a GitHub runner, first run — which is a measurement of the
        APT INSTALL, not of the compile, and was made against the template's
        package set rather than this one. Treat it as a prior.
    - call: the claims-verification pass
      does: >-
        Not a command. A person, reading report/draft.md against cloned
        checkouts, filling report/claims-verified.md. It is the only instrument
        this repository has and it is not automatable — see od-003 for what
        happened to the one part of it that was.
      cost: unmeasured

# ------------------------------------------------------------------------------
# LAST MEASURED NUMBERS
#
# Measurements made BY THIS REPOSITORY, each with the commit that produced it.
# Inherited priors are not measurements and do not belong here. Values enter
# this list only when a run in THIS repository produced them. An inherited
# number is never promoted here without a re-measurement — it stays in
# docs/inherited-measurements.yaml with status `inherited`, and the new
# measurement is added as its own entry.
# ------------------------------------------------------------------------------
# NOTHING HERE YET, AND ONLY ONE THING WILL EVER BE ELIGIBLE. This repository
# runs nothing, so it measures nothing — except the tally of its own
# claims-verification pass, which is produced here and is the one number it will
# own. Every other figure it handles is `inherited` and stays that way, including
# a figure re-read at source: re-reading resolves a citation, it does not
# reproduce a measurement under this repository's conditions, because this
# repository has none.
measurements: []
# - ids: [<measurement ids in docs/inherited-measurements.yaml>]
#   commit: <the commit that produced them>
#   what: <one paragraph: what was measured>
#   where: docs/inherited-measurements.yaml, status "measured"
#   headline: <the numbers, in a sentence a report could quote>
#   caveat: <the scope. THIS FIELD IS NOT OPTIONAL — see the header of
#            report/claims-verified.md for what happens when it is dropped
#            somewhere between here and the prose.>

# ------------------------------------------------------------------------------
# OPEN DECISIONS
#
# Questions this repository has not answered. A question that has not been tried
# is not an ADR and not a foreclosure; it lives here until something decides it.
#
# altitude — how far the decision reaches, and therefore how expensive it is to
# get wrong:
#   fw     framework. Changes the shape of the thing: interfaces between layers,
#          what a type means, what the project is committed to. Expensive to
#          reverse; reversing it invalidates work built on top.
#   exp    experiment design. What gets measured, against what falsifier.
#   impl   implementation. Local, reversible, no interface moves.
#   infra  tooling, CI, layout. Reversible, affects no result.
# ------------------------------------------------------------------------------
open_decisions:

  - id: od-001
    altitude: exp
    status: open
    title: The claims-verification pass over report/draft.md has not been run.
    the_question: >-
      Which of the draft's factual claims about the source project survive being
      read at source, and at what rate. The draft's own status block declares
      this open; §8.4 rests the document's claim to be evidence rather than a
      closed loop on the pass having fired.
    what_would_decide_it: >-
      Clone the sources (gap-001), run the pass in report/claims-verified.md,
      fill its count table. DECLARED IN ADVANCE, per the field's own rule: the
      tally is recorded whatever it says, and a rate of 0 UNSUPPORTED with a
      substantial UNDER-QUALIFIED count would REPRODUCE the instance's result
      rather than contradict it. A pass that returns everything CONFIRMED is the
      suspicious outcome, not the good one, and would prompt asking whether the
      claims were selected to be safe.
    depends_on: [gap-001]

  - id: od-002
    altitude: exp
    status: open
    title: mn-001 and mn-002 give different totals for the same verification pass.
    the_question: >-
      Is the instance's pass 22 claims or 18? Both figures are in circulation in
      this repository, they agree on 3 corrected and 8 under-qualified, and they
      disagree on the total and the confirmed count.
    what_would_decide_it: >-
      Open the instance's claims-verification file at 5f8e39f and count. THE
      CRITERION IS DECLARED FIRST AND IS met-002: define "load-bearing" before
      counting, not after seeing which definition reconciles the two. Record the
      result as a NEW entry; supersede neither.
    depends_on: [gap-001, met-002]

  - id: od-003
    altitude: infra
    status: open
    title: >-
      The repeated-claim grep in report/claims-verified.md does not work on this
      repository's prose.
    the_question: >-
      The template ships a mechanical check — extract every numeral, find the
      repeated ones, read their occurrences side by side — and credits it with
      the one rule-fires-in-the-wild event in the whole template. It is written
      against `report/sections/*.tex` and `report/main.tex`. This repository's
      prose is in `report/draft.md`, which will not be typeset until step 4, so
      for the entire period the check is most needed IT POINTS AT FILES THAT ARE
      EMPTY OR ABSENT. Run against draft.md as written it returns section numbers
      as figures and its `uniq -c -f2` collapses the output to one line.
    what_would_decide_it: >-
      Rewrite the command against draft.md and verify it on a known answer:
      it must surface "thirteen" and the mn-001/mn-002 pair, both of which are
      known to repeat. A check that cannot find a defect already recorded in the
      ledger is not yet a check. NOT AUTOMATED INTO CI — see fc-001's scope for
      why a repetition count has no pass/fail threshold.
    depends_on: []

  - id: od-004
    altitude: infra
    status: open
    title: Nothing verifies that the two ledgers are parseable YAML.
    the_question: >-
      docs/state.yaml and docs/inherited-measurements.yaml are the record, they
      are hand-edited, and after fc-001 no automated check reads them at all.
      A syntax error would be silent until someone tried to parse the file, and
      this repository's whole argument is that a record which cannot be read
      cannot be checked.
    what_would_decide_it: >-
      A ten-line workflow step running a YAML parser over both files. IT IS OPEN
      RATHER THAN DONE FOR ONE REASON: it needs a YAML parser, PyYAML is not in
      the standard library, and CLAUDE.md's working agreement says never add a
      dependency without asking. The ask is this entry. Note that the risk is
      already demonstrated locally — no YAML parser was available on this machine
      without creating a throwaway environment.
    depends_on: []

  - id: od-005
    altitude: impl
    status: open
    title: Section 8.6 of the draft is unwritten.
    the_question: >-
      "How did it feel" — recorded because the draft's status block assigns it to
      the first author, and an unwritten section that is nobody's tracked
      responsibility is indistinguishable from a section that was cut.
    what_would_decide_it: The first author writing it, or deciding to cut it and saying so here.
    depends_on: []

# - id: od-0NN
#   altitude: fw | exp | impl | infra
#   status: open
#   title: <one line>
#   the_question: <what would have to be true either way>
#   what_would_decide_it: >-
#     The measurement, the run, or the spike that settles it. DECLARE THE METRIC
#     AND THE THRESHOLD HERE, BEFORE THE RESULT EXISTS. A criterion chosen after
#     seeing which one makes the result look best is the same defect as an
#     unexamined carried method, with a different unit on it.
#   depends_on: []

# ------------------------------------------------------------------------------
# FORECLOSURE LEDGER
#
# Options this repository has closed, and what reopening one would cost. Recorded
# so that a later session can tell "we decided against this" from "nobody thought
# of it" — the two look identical in a codebase and are not the same thing.
#
# HOW TO REOPEN ONE: ANNOTATE, NEVER REVERSE.
#
# `cost_to_reopen` names a price; this names the procedure. Where new evidence
# bears on a closed decision, ANNOTATE THE ENTRY with what was found and what a
# PRE-REGISTERED RE-TEST WOULD NEED, and LEAVE THE CLOSURE STANDING until that
# test is run.
#
# WHY: a foreclosure reversed on a re-analysis that did not pre-register the
# reversal is the same defect as a foreclosure closed on evidence that does not
# bear on it. Both substitute a number that was not asked for in advance for one
# that was. The asymmetry is deliberate — closing needs a pre-registered result,
# and so does re-opening.
#
# TWO OBSERVED FORMS, both from the instance:
#
#   AMENDED IN PLACE, when an entry overstated what had been measured. A
#   falsifier verdict was first written as `did_not_fire / ADDITIVE`; the
#   measurement did not bear on the falsifier at all — it priced building a
#   component, where the falsifier asked whether an interface was invasive — and
#   it was corrected in place to `DEFERRED / UNANSWERED`, with an `amended` field
#   recording what the original said. A foreclosure carrying the same
#   overstatement was corrected in the same commit. NOT A REVERSAL: nothing was
#   decided differently, a claim was withdrawn to what the evidence supported.
#
#   ANNOTATED, when a later re-analysis moved a comparison an entry rested on.
#   A re-analysis that moved eleven comparisons annotated four foreclosures and
#   reversed none — one stood and was strengthened, one gained a note on where
#   its evidence comes from AND what a pre-registered re-test would need, two
#   were untouched. Every closure stood.
#
# Both forms are additive. Neither deletes what was there, because the
# disagreement between what was believed and what is now known is the
# information — the same argument that keeps a superseded measurement in
# docs/inherited-measurements.yaml instead of editing its value.
# ------------------------------------------------------------------------------
foreclosures:

  # NOTE ON WHAT KIND OF EVIDENCE THESE REST ON. CLAUDE.md requires that a
  # decision be recorded AFTER the thing it decides has been tried. These were:
  # the deletions were made and the tree was read afterwards for what broke.
  # That is a weaker trial than an experiment and it is named as such in each
  # `rationale` — the evidence is "the reference dangles" or "the step cannot
  # pass", both checkable from the tree, not "we measured it".

  - id: fc-001
    altitude: infra
    closed: >-
      The Python CI gate (.github/workflows/ci.yml): a two-interpreter matrix
      running ruff, ruff format, mypy and pytest.
    in_favour_of: >-
      .github/workflows/report.yml alone. CI compiles the document and uploads
      the PDF and the log; that is the entire automated surface.
    rationale: >-
      Every step in the workflow is inapplicable, and the first one FAILS rather
      than passing vacuously: `pip install -e ".[dev]"` needs pyproject.toml,
      which is gone (fc-002), so the job cannot start. Downstream, `ruff check
      src tests` and `mypy` name directories that no longer exist and `pytest`
      has no suite. The matrix's stated purpose — that 3.12 is the only
      environment testing `requires-python = ">=3.12"` — is void once nothing
      declares a Python requirement. A workflow retained here would be red on
      every push for reasons unrelated to the report, and a check that fails for
      the wrong reason is one people learn to override; the template argues
      exactly this in report/figures/README.md against byte-diffing figures.
    decided_by: The maintainer, on the instantiation specification; executed by Code.
    scope: >-
      THIS DOES NOT CLOSE AUTOMATED CHECKING GENERALLY, and two specific things
      stay open. (1) od-004: a YAML-parse gate over the two ledgers is wanted and
      is blocked only on the dependency question. (2) The repeated-claim check
      (od-003) was considered for CI and DELIBERATELY LEFT MANUAL — repetition of
      a figure is legal, so the check has no pass/fail threshold, only an
      instruction to read occurrences side by side. Automating it would produce a
      gate that fires on correct documents. It stops holding the moment any
      executable code lands in this repository: a figure script would need the
      lint and type gates back with it, and the .reference/ import guard too.
    cost_to_reopen: >-
      Low. Restore ci.yml and pyproject.toml together from `template` at 81a638e
      and narrow the matrix to whatever the new code needs. They are one
      decision, not two.
    decided_in: The instantiation commit.

  - id: fc-002
    altitude: infra
    closed: pyproject.toml.
    in_favour_of: No Python packaging or tool configuration in the repository at all.
    rationale: >-
      The file's four jobs are packaging `src/research` (deleted), configuring
      pytest (no suite), ruff (no code) and mypy (no code). The one condition
      under which it would have earned its place — a figure generated from data —
      does not hold and was checked rather than assumed: report/figures/ is
      empty, no `make_*.py` exists, and every occurrence of the word "figure" in
      report/draft.md means A NUMERAL, not a graphic. The document has no
      plots. Keeping the file would have declared a Python project that does not
      exist, which is the same defect as an untested claim carried forward.
    decided_by: Code, from the tree; confirmed against the draft's own text.
    scope: >-
      Bounded by that check and by nothing else. IT STOPS HOLDING THE MOMENT ONE
      GENERATED FIGURE IS WANTED — at which point pyproject.toml comes back with
      the plotting dependency, and report/figures/README.md's rules (draw to
      6.5in, assert the drawn numbers against this ledger, do not byte-diff the
      PDF) come back into force. That README is retained for exactly this
      contingency; see fc-005.
    cost_to_reopen: Low. Restore from `template` and add the plotting dependency, having asked.
    decided_in: The instantiation commit.

  - id: fc-003
    altitude: fw
    closed: >-
      src/research/, experiments/exp000_example/, and tests/test_scaffold.py.
    in_favour_of: A repository containing documents and a build, and nothing executable.
    rationale: >-
      No library, no experiment, no measurement apparatus. The example experiment
      teaches a five-file order that nothing here will follow. THE ONE PART THAT
      NEEDED A SEPARATE ARGUMENT is tests/test_scaffold.py, which was described in
      the specification as having one job — the spikes import ban — and in fact
      had four: package import, the spikes ban, the .reference/ ban, and
      "every experiment has a preregistration". Three lose their subject with
      fc-003 and fc-004. THE FOURTH DOES NOT: the .reference/ guard protects a
      convention this repository actively depends on, since the pinned checkouts
      are how every claim gets verified. It was deleted anyway, because its
      precondition is that executable code exists to be scanned, and there is
      none — the guard would have passed by scanning an empty set, which is the
      shape of a check that cannot fail. The convention now rests on a comment in
      .gitignore and on nothing else. That is a real loss and it is recorded
      here rather than absorbed.
    decided_by: The maintainer, on the instantiation specification; the fourth-guard analysis by Code.
    scope: >-
      Does not close the .reference/ CONVENTION, which is retained and is
      load-bearing. Stops holding the moment any .py file lands: restore the
      .reference/ guard first, before the others.
    cost_to_reopen: >-
      Low for the guards — restore from `template` at 81a638e and rename PACKAGE.
      Moderate for src/ and experiments/, but reopening those means this is no
      longer a document-only repository, which is a different decision.
    decided_in: The instantiation commit.

  - id: fc-004
    altitude: fw
    closed: spikes/, its README, and its enforcement test.
    in_favour_of: >-
      No low-ceremony lane. Exploratory prose is a discarded draft section and
      lives in report/.
    rationale: >-
      Two reasons, and the second is the one that decided it. FIRST, the lane has
      nothing to be low-ceremony about: a spike is where you TRY something, and
      the trigger is "a question written about twice WITHOUT BEING TESTED". This
      repository tests nothing. SECOND, and this is the finding: §6 of
      report/draft.md argues that a project with strong ceremony structurally
      will not reach for its informal lane, evidenced by the instance shipping
      spikes/ with rules and enforcement and using it zero times in thirteen
      experiments. Instantiating the directory here would have produced a second
      unused spikes/ that looked like a second data point and was really the
      first one copied — and its emptiness would then have been cited as evidence
      for the argument it was copied from. Declining to instantiate keeps the
      instance's n at one.
    decided_by: Code, from §6 of the draft; ratified by the specification's "almost certainly delete".
    scope: >-
      DOES NOT CLOSE THE FINDING, which stands and is preserved in
      docs/workflow.md. Does not claim spikes/ is a bad idea in general — it
      claims this repository is not a place where the question can be asked. It
      stops holding if this repository ever runs anything.
    cost_to_reopen: Low. Restore the directory and its README from `template`.
    decided_in: The instantiation commit.

  - id: fc-005
    altitude: infra
    closed: >-
      Deleting docs/state.yaml on the grounds that a document-only project has no
      experiments to sequence.
    in_favour_of: Keeping it, with the experiment-shaped machinery filled rather than removed.
    rationale: >-
      The ledger's argument never mentioned experiments: it exists so a later
      session can distinguish "we decided against this" from "nobody thought of
      it". Editorial decisions have that property. THE EVIDENCE IS THIS FILE'S
      OWN CONTENT — the instantiation task generated six foreclosures, five open
      decisions and a stopping rule before any report work began, and every one
      of fc-001..fc-006 is a deletion that would otherwise be invisible in a
      tree that simply appears never to have had tests. A ledger that fills
      during its own instantiation has demonstrated its use rather than asserted
      it. The stopping rule, which the template calls its hardest-won required
      field, was also easy to answer here and is now answered.
    decided_by: Code, from the outcome of attempting the adaptation without one.
    scope: >-
      NAMES WHAT DID NOT TRANSFER RATHER THAN CLAIMING A CLEAN FIT.
      `falsifier_verdicts` and `constraints` are empty and may stay empty: a
      falsifier is declared before a run, and this repository's one instrument is
      a reading. The `position.checking` procedure survives but is thinner, since
      "derive it from the ledger and merged history" has a much smaller ledger to
      derive from. If those two blocks are still empty when the report ships,
      that is a finding about the template's generality and belongs in the record.
    cost_to_reopen: >-
      Moderate and asymmetric. Deleting it later is cheap; deleting it now would
      have cost the six entries above, which could not be reconstructed once the
      reasoning that produced them was gone.
    decided_in: The instantiation commit.

  - id: fc-006
    altitude: fw
    closed: >-
      Deleting docs/inherited-measurements.yaml on the grounds that a report
      containing only inherited figures is a category error for a ledger of
      inherited figures.
    in_favour_of: >-
      Keeping it as the SPINE of the repository — the file the verification pass
      resolves claims into.
    rationale: >-
      The premise is right and the conclusion inverts. Every figure in
      report/draft.md is `inherited` by the file's own definition, which makes
      this the file's ideal case rather than its edge case: a count in a
      repository at a pinned SHA is exactly recheckable in a way a physical
      measurement is not. THREE PIECES OF EVIDENCE, all checkable. (1)
      report/claims-verified.md is retained, and item 4 of its "what each entry
      records" cites `docs/inherited-measurements.yaml <id>` as the Source field
      — deleting the ledger breaks the instrument. (2) Appendix A's closing
      sentence, "Every claim these notes make about what happened can be checked
      in the third", is a promise whose mechanism IS the `sources` block with its
      pinned SHA; without it, "verifiable at source" is an assurance and not a
      pointer. (3) The decisive one: reading the draft against the template
      surfaced mn-001 and mn-002, two statements of the same figure that
      disagree on the denominator, sitting in two files that have coexisted
      without contradiction because prose cannot contradict prose. That is the
      file's founding argument, demonstrated on this repository's own documents.
    decided_by: Code, on the mn-001/mn-002 finding.
    scope: >-
      DOES NOT CLAIM THE SCHEMA FITS CLEANLY. `units`, `n`, `conditions` and
      `provenance.environment` are shaped for physical measurement and read
      awkwardly for a count of experiments; they are filled honestly rather than
      deleted, and the file's header says so. Does not claim the ledger is
      complete: it is seeded with what this task handled, and gap-002 records
      that no census exists. `status: measured` remains reachable by exactly one
      future value, this report's own claims tally.
    cost_to_reopen: >-
      High, and rising. Every id allocated here is citable from the report, and
      the ids are permanent by the rule at the top of this file.
    decided_in: The instantiation commit.

# - id: fc-0NN
#   altitude: fw | exp | impl | infra
#   closed: <the option that is now closed>
#   in_favour_of: <what was taken instead>
#   rationale: <the evidence, cited by id. Not the argument — the evidence.>
#   decided_by: <who or what. "The maintainer, on <id>" and "exp0NN" differ.>
#   scope: >-
#     WHAT THIS DOES NOT CLOSE, and under what conditions it stops holding.
#     REQUIRED. A foreclosure without a stated scope gets read as general, and
#     that is the single most common way a correct measurement becomes a wrong
#     belief: the number was right, the conditions it was measured under were
#     dropped, and by the time it reaches a report it has become a property of
#     the framework.
#   cost_to_reopen: <low | moderate | high, and what specifically must be redone>
#   decided_in: <the experiment, file, or commit>

# ------------------------------------------------------------------------------
# FALSIFIER VERDICTS
#
# EMPTY, AND THE EMPTINESS IS THE ENTRY. See fc-005's scope. A falsifier is
# declared before a run, and this repository's only instrument is a person
# reading a document against a checkout — od-001 carries a declared-in-advance
# expectation, which is the nearest thing available and is deliberately NOT
# called a falsifier here. If this block is still empty when the report ships,
# that is a fact about how far the template's loop reaches into document work,
# and it belongs in the record rather than being quietly tidied away.
#
# Every specification carries a falsifier (docs/workflow.md). A verdict that
# lives only in a pull-request body is not in the tree and a cold session cannot
# read it — and by this repository's own argument, a verdict with no durable
# record cannot be checked, which is the same defect as a specification with no
# falsifier. They are recorded here, with the numbers, whichever way they came
# out, INCLUDING THE ONES THAT DID NOT FIRE.
# ------------------------------------------------------------------------------
falsifier_verdicts: []
# - id: fv-0NN
#   from: <the specification or experiment that declared it>
#   falsifier: <the statement, quoted as declared, before the run>
#   fired: true | false
#   detail: <the numbers, against the declared threshold>
#   consequence: >-
#     What follows. A falsifier that fired and changed nothing, and one that did
#     not fire and changed nothing, are different records and both are worth
#     making. Say which.
#   verified_at_commit: <commit>

# ------------------------------------------------------------------------------
# STANDING CONSTRAINTS
#
# Measured costs and impossibilities that bind future work regardless of what is
# decided. Not decisions; consequences.
#
# EMPTY. Nothing here has measured a cost. The candidate — what the verification
# pass costs to run — becomes a constraint the first time it is paid, and
# recording it is worth doing, since the draft's §5 argues the whole method on a
# cost/catch ratio and this repository will have a data point for it.
# ------------------------------------------------------------------------------
constraints: []
# - id: cn-0NN
#   from: <the experiment and falsifier that produced it>
#   statement: <what is now known to be impossible or to cost what it costs>
#   evidence: <the numbers>
#   binds: <who, and when. A constraint that binds nobody yet says so.>
#   caveat: <where the evidence is weaker than the statement sounds>
