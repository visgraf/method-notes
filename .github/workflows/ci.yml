name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PULL REQUESTS RUN ONE INTERPRETER; MAIN RUNS BOTH. Conditional, so here
        # is why, because the next reader will ask.
        #
        # 3.13 is what every developer machine and every verification clone uses.
        # That makes 3.12 the ONLY environment in which pyproject.toml's
        # `requires-python = ">=3.12"` is tested at all. Dropping it entirely
        # would leave that declaration an untested claim carried forward on
        # nobody's authority -- which is the shape of the most expensive failure
        # in the project this template came from: an inherited criterion used
        # unexamined across TEN experiments before anyone asked what it tested.
        # See met-000-EXAMPLE in docs/inherited-measurements.yaml.
        #
        # KEEPING 3.12 ON `main` means the claim is still tested before anything
        # lands, while a PR iteration pays for one interpreter instead of two.
        #
        # ONE JOB WITH A CONDITIONAL MATRIX, not two jobs with `if:`. Two jobs
        # would need the whole step list twice -- install, lint, format, types,
        # tests, and every comment explaining them -- so each future edit would
        # have to be made in both copies and would eventually be made in one. The
        # cost of this form is that the expression is dense; the cost of the
        # other is a duplicate that drifts. `fromJSON` is needed because a matrix
        # dimension must be a real list, and a GitHub expression cannot produce
        # one literally.
        # Folded scalar: every continuation line sits at the SAME indent, so YAML
        # folds the newlines to spaces and Actions receives one expression.
        # Indenting them further would make YAML keep the newlines literally.
        python-version: >-
          ${{ github.event_name == 'pull_request'
          && fromJSON('["3.13"]')
          || fromJSON('["3.12", "3.13"]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Project dependencies are deliberately absent from this file: they belong
      # in pyproject.toml, so that a local environment and CI install the same
      # set and neither can drift ahead of the other. Add optional extras to this
      # line only when CI needs an extra a user does not -- and when you do, say
      # in a comment WHICH TEST would otherwise skip, because a step installed
      # for no stated reason is one nobody can later remove.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      # Type checker. Blocking, not advisory: a type error is a failure.
      - name: Types
        run: mypy

      # The suite. Includes the spikes/ import ban and the no-reference-checkout
      # guard, which is why those rules can be stated as enforced rather than
      # intended. Note that the reference clones are git-ignored and absent here,
      # so any code that reached into one would fail at this step.
      #
      # `-rs` REPORTS SKIPS. A test that needs an instrument the runner does not
      # have -- a GPU, a renderer, a licensed solver -- should skip with a reason
      # naming what is left unverified, and that reason should be visible in the
      # log. A silent skip is a gap in the evidence that looks like a pass.
      - name: Tests
        run: pytest -rs
